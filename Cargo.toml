[package]
name = "chingtech-monitor"
version = "2.1.1"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
uuid = { version = "1", features = ["v4"] }
tiny_http = "0.12"
tao = "0.30"
wry = "0.47.2"
rfd = "0.15"

[profile.release]
lto = true
codegen-units = 1
strip = true

